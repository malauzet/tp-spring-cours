spring.application.name=DemoSpring

# Datasource: local defaults, overridable per environment via env vars
# (DB_URL / DB_USERNAME / DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/recensement_spring}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Do not touch the schema by default. The 'dev' profile enables ddl-auto=update.
spring.jpa.hibernate.ddl-auto=none

# Keep the persistence context bound to the transaction, not the whole request.
spring.jpa.open-in-view=false

# Error responses: never leak stack traces; always include the message field.
server.error.include-stacktrace=never
server.error.include-message=always
